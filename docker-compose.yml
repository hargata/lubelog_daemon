---

services:
  app:
    image: ghcr.io/hargata/lubelogger_daemon:latest
    # environment:
    #  - LL_DAEMON_PASSWORD=
    restart: unless-stopped
    # volumes used to keep data persistent
    volumes:
      - config:/App/config
    # expose port and/or use serving via traefik
    ports:
      - 40750:8080

volumes:
  config: